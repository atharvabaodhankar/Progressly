  <!-- 9. AI Worker to RDS PostgreSQL -->
  <path d="M 671 555 L 671 595" stroke="#059669" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/>

  <!-- 10. Express API to Bedrock Nova Pro (RAG query branch) -->
  <path d="M 766 230 L 1060 230 L 1060 615 L 1090 615" stroke="#7E22CE" stroke-width="1.75" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
</svg>
