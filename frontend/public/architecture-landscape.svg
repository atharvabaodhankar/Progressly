        <text x="10" y="38" font-size="9" font-family="monospace" fill="#059669">1024d vectors</text>
      </g>
      <g transform="translate(155, 62)">
        <rect width="130" height="50" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="10" y="20" font-size="10" font-weight="700" fill="#334155">historical_records</text>
        <text x="10" y="38" font-size="9" font-family="monospace" fill="#7C3AED">40 Grounded records</text>
      </g>
      <g transform="translate(295, 62)">
        <rect width="120" height="50" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="10" y="20" font-size="10" font-weight="700" fill="#334155">audit_log</text>
        <text x="10" y="38" font-size="9" font-family="monospace" fill="#4648D4">Immutable trail</text>
      </g>
    </g>

    <!-- AWS Secrets Manager -->
