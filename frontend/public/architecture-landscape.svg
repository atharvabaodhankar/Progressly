<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="100%" height="100%" fill="none" style="background:#FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <marker id="arrow-land" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 6 4 L 1 6.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-purple-land" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 6 4 L 1 6.5 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- TOP CAPTION -->
  <g transform="translate(40, 32)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#0f172a" letter-spacing="-0.2">Progressly — System Architecture</text>
    <text x="0" y="18" font-size="11" font-weight="400" fill="#64748b">Production Multi-Account Topology &amp; Asynchronous Pipeline (Landscape)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. CLIENT LAYER (LEFT)                                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="200" height="530" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" font-size="11" font-weight="700" fill="#0f172a">Client Layer</text>

    <!-- Browser -->
    <rect x="14" y="44" width="172" height="70" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="24" y="68" font-size="11" font-weight="700" fill="#0f172a">Browser / Client</text>
    <text x="24" y="84" font-size="10" font-weight="400" fill="#475569">Field Supervisor &amp;</text>
    <text x="24" y="98" font-size="10" font-weight="400" fill="#475569">Planning Engineer</text>

    <!-- Arrow down -->
    <path d="M 100 114 L 100 160" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow-land)"/>

    <!-- Vercel Edge -->
    <rect x="14" y="160" width="172" height="70" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="24" y="184" font-size="11" font-weight="700" fill="#0f172a">Vercel Edge</text>
    <text x="24" y="200" font-size="10" font-weight="400" fill="#475569">Next.js 14 App Router</text>
    <text x="24" y="214" font-size="9" font-family="monospace" fill="#64748b">/api-proxy/*</text>

    <text x="14" y="300" font-size="9.5" font-weight="400" fill="#64748b">HTTPS / TLS 1.3 Ingress</text>
    <text x="14" y="316" font-size="9.5" font-weight="400" fill="#64748b">Zero-CORS Route Tunnel</text>
  </g>

  <!-- Arrow Client Layer -> Account B -->
  <path d="M 240 265 L 270 265" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow-land)"/>
  <text x="235" y="258" font-size="8.5" font-family="monospace" fill="#64748b">Port 80/443</text>

  <!-- ========================================================================= -->
  <!-- 2. BOUNDARY BOX: AWS ACCOUNT B (MIDDLE)                                   -->
  <!-- ========================================================================= -->
  <g transform="translate(270, 70)">
    <rect x="0" y="0" width="530" height="530" rx="4" fill="#FFFFFF" stroke="#2563eb" stroke-width="1.2"/>
    <text x="16" y="22" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.2">AWS Account B — Infrastructure (ap-south-1)</text>

    <!-- ALB -->
    <rect x="16" y="40" width="220" height="42" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="26" y="58" font-size="11" font-weight="700" fill="#0f172a">Application Load Balancer</text>
    <text x="26" y="72" font-size="9.5" font-weight="400" fill="#475569">Public Ingress • Direct IGW</text>

    <!-- Arrow ALB -> ECS API -->
    <path d="M 236 61 L 265 61" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow-land)"/>

    <!-- ECS API -->
    <rect x="265" y="40" width="245" height="52" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="277" y="58" font-size="11" font-weight="700" fill="#0f172a">ECS Fargate — Express API</text>
    <text x="277" y="73" font-size="9.5" font-weight="400" fill="#475569">progressly-backend-service-prod</text>
    <text x="277" y="85" font-size="8.5" font-family="monospace" fill="#64748b">0.5 vCPU • 1GB RAM • Port 4000</text>

    <!-- Supporting Secrets Manager -->
    <rect x="16" y="104" width="130" height="42" rx="3" fill="#FFFFFF" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="24" y="122" font-size="9.5" font-weight="700" fill="#334155">Secrets Manager</text>
    <text x="24" y="136" font-size="8.5" font-family="monospace" fill="#64748b">DB &amp; Bedrock IAM</text>

    <!-- Dotted lines from Secrets Manager -->
    <path d="M 146 125 L 340 125 L 340 92" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
    <path d="M 81 146 L 81 290 L 265 290" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

    <!-- Sync Path Arrow (ECS API -> RDS) -->
    <path d="M 450 92 L 450 370" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow-land)"/>
    <text x="456" y="160" font-size="8.5" font-family="monospace" fill="#475569">Sync SQL</text>

    <!-- Async Path (Right) -->
    <!-- S3 Bucket -->
    <rect x="265" y="115" width="150" height="42" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="275" y="133" font-size="10.5" font-weight="700" fill="#0f172a">Amazon S3 Bucket</text>
    <text x="275" y="147" font-size="8.5" font-family="monospace" fill="#64748b">raw-reports-prod</text>

    <path d="M 340 157 L 340 178" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow-land)"/>

    <!-- Lambda Router -->
    <rect x="265" y="178" width="150" height="42" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="275" y="196" font-size="10.5" font-weight="700" fill="#0f172a">AWS Lambda</text>
    <text x="275" y="210" font-size="8.5" font-family="monospace" fill="#64748b">s3-sqs-router-prod</text>

    <path d="M 340 220 L 340 240" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow-land)"/>

    <!-- SQS Queue -->
    <rect x="265" y="240" width="150" height="42" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="275" y="258" font-size="10.5" font-weight="700" fill="#0f172a">Amazon SQS</text>
    <text x="275" y="272" font-size="8.5" font-family="monospace" fill="#64748b">report-queue-prod</text>

    <path d="M 340 282 L 340 300" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow-land)"/>

    <!-- ECS AI Worker -->
    <rect x="265" y="300" width="245" height="50" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="277" y="318" font-size="11" font-weight="700" fill="#0f172a">ECS Fargate — AI Worker</text>
    <text x="277" y="333" font-size="9.5" font-weight="400" fill="#475569">progressly-ai-worker-service-prod</text>
    <text x="277" y="344" font-size="8.5" font-family="monospace" fill="#64748b">1.0 vCPU • 2GB RAM</text>

    <!-- AI Worker -> RDS -->
    <path d="M 340 350 L 340 370" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow-land)"/>

    <!-- RDS Database -->
    <rect x="16" y="370" width="494" height="60" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="28" y="392" font-size="11.5" font-weight="700" fill="#0f172a">Amazon RDS PostgreSQL 16.9 + pgvector</text>
    <text x="28" y="408" font-size="9.5" font-weight="400" fill="#475569">Master WBS Activities, Extracted Milestones, Matches, Audit Traces</text>
    <text x="28" y="420" font-size="8.5" font-family="monospace" fill="#64748b">1024d HNSW Cosine Index • Tenant &amp; Project Isolation</text>

    <!-- Subnet text -->
    <text x="16" y="500" font-size="9" font-family="monospace" fill="#64748b">VPC: 10.0.0.0/16 • Public Subnets with Direct IGW Ingress (No NAT Gateways)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. BOUNDARY BOX: AWS ACCOUNT A (RIGHT)                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(830, 70)">
    <rect x="0" y="0" width="310" height="530" rx="4" fill="#FFFFFF" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="16" y="22" font-size="11" font-weight="700" fill="#6d28d9" letter-spacing="0.2">AWS Account A — Bedrock</text>

    <!-- Nova Micro -->
    <rect x="16" y="40" width="278" height="96" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="26" y="60" font-size="11" font-weight="700" fill="#0f172a">Amazon Nova Micro</text>
    <text x="26" y="74" font-size="9" font-family="monospace" fill="#6d28d9">apac.amazon.nova-micro-v1:0</text>
    <text x="26" y="92" font-size="9.5" font-weight="400" fill="#475569">Entity Extraction (Discipline, Qty)</text>
    <text x="26" y="106" font-size="9" font-family="monospace" fill="#64748b">$0.035 / $0.14 per 1M</text>

    <!-- Titan Embeddings V2 -->
    <rect x="16" y="152" width="278" height="96" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="26" y="172" font-size="11" font-weight="700" fill="#0f172a">Amazon Titan Embeddings V2</text>
    <text x="26" y="186" font-size="9" font-family="monospace" fill="#6d28d9">amazon.titan-embed-text-v2:0</text>
    <text x="26" y="204" font-size="9.5" font-weight="400" fill="#475569">1024-dim Vector Generation</text>
    <text x="26" y="218" font-size="9" font-family="monospace" fill="#64748b">$0.020 per 1M tokens</text>

    <!-- Nova Pro -->
    <rect x="16" y="264" width="278" height="96" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="26" y="284" font-size="11" font-weight="700" fill="#0f172a">Amazon Nova Pro</text>
    <text x="26" y="298" font-size="9" font-family="monospace" fill="#6d28d9">apac.amazon.nova-pro-v1:0</text>
    <text x="26" y="316" font-size="9.5" font-weight="400" fill="#475569">Institutional Memory RAG</text>
    <text x="26" y="330" font-size="9" font-family="monospace" fill="#64748b">$0.80 / $3.20 per 1M</text>

    <text x="16" y="470" font-size="9" font-family="monospace" fill="#64748b">Scoped IAM Execution Role</text>
    <text x="16" y="485" font-size="9" font-family="monospace" fill="#64748b">Region: ap-south-1 (Mumbai)</text>
    <text x="16" y="500" font-size="9" font-family="monospace" fill="#64748b">Zero persistent model caching</text>
  </g>

  <!-- Cross-account arrow from AI Worker to Account A -->
  <path d="M 780 395 L 830 395" stroke="#6d28d9" stroke-width="1.2" fill="none" marker-end="url(#arrow-purple-land)"/>
  <rect x="760" y="375" width="90" height="15" rx="2" fill="#FFFFFF" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="764" y="386" font-size="7.5" font-family="monospace" font-weight="600" fill="#6d28d9">cross-account IAM</text>

  <!-- ========================================================================= -->
  <!-- 4. SIDE NOTE / LEGEND (BOTTOM)                                            -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 625)">
    <line x1="0" y1="0" x2="1100" y2="0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="20" font-size="10" font-weight="700" fill="#1e293b">Operational Calibration &amp; Confidence Tiers:</text>
    <text x="0" y="36" font-size="9.5" font-weight="400" fill="#475569">1. ≥95% Confidence (Tier 1): Auto-approved &amp; linked directly to baseline schedule WBS activity.</text>
    <text x="0" y="50" font-size="9.5" font-weight="400" fill="#475569">2. 70–94% Confidence (Tier 2): Routed to Lead Planning Engineer review queue for one-click verification.</text>
    <text x="0" y="64" font-size="9.5" font-weight="400" fill="#475569">3. &lt;70% Confidence (Tier 3): Flagged for manual WBS resolution; zero automated schedule alterations.</text>
  </g>
</svg>
