<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="100%" height="100%" fill="none" style="background:#FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4648D4"/>
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- TITLE HEADER -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#0F172A" letter-spacing="-0.5">Progressly : Enterprise Production System Architecture</text>
    <text x="0" y="24" font-size="13" font-weight="500" fill="#64748B">Event-Driven Schedule Linking Pipeline &amp; Multi-Account Bedrock RAG Engine (ap-south-1)</text>
  </g>

  <!-- ZONE 1: CLIENT & VERCEL INGRESS -->
  <g transform="translate(48, 105)">
    <rect width="250" height="665" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="20" y="32" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">ZONE 1: CLIENT &amp; VERCEL INGRESS</text>
    <rect x="20" y="44" width="210" height="1" fill="#E2E8F0"/>

    <!-- Client Card 1: Web Dashboard -->
    <g transform="translate(20, 65)">
      <rect width="210" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
      <rect x="16" y="16" width="32" height="32" rx="8" fill="#F1F5F9"/>
      <path d="M22 26 h20 M22 32 h12 M22 38 h16" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <text x="58" y="30" font-size="13" font-weight="700" fill="#0F172A">Web Dashboard</text>
      <text x="58" y="46" font-size="11" font-weight="500" fill="#64748B">Next.js 14 App Router</text>
      <rect x="16" y="70" width="178" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="26" y="87" font-size="10" font-family="monospace" font-weight="600" fill="#4648D4">HTTPS / TLS 1.3</text>
    </g>

    <!-- Reverse Proxy Card -->
    <g transform="translate(20, 205)">
      <rect width="210" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
      <rect x="16" y="16" width="32" height="32" rx="8" fill="#EEF2FF"/>
      <path d="M24 32 h16 M34 26 l6 6 -6 6" stroke="#4648D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="30" font-size="13" font-weight="700" fill="#0F172A">Vercel Edge Proxy</text>
      <text x="58" y="46" font-size="11" font-weight="500" fill="#64748B">Zero-CORS Route Tunnel</text>
      <rect x="16" y="70" width="178" height="26" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="26" y="87" font-size="10" font-family="monospace" font-weight="700" fill="#4338CA">/api-proxy/* → ALB:80</text>
    </g>

    <!-- Client Card 2: Mobile / Site Tablet -->
    <g transform="translate(20, 345)">
      <rect width="210" height="100" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
      <rect x="16" y="16" width="32" height="32" rx="8" fill="#F1F5F9"/>
      <rect x="24" y="22" width="16" height="20" rx="3" stroke="#475569" stroke-width="2"/>
      <text x="58" y="30" font-size="13" font-weight="700" fill="#0F172A">Site Mobile Diary</text>
      <text x="58" y="46" font-size="11" font-weight="500" fill="#64748B">Field Supervisor Input</text>
      <text x="16" y="78" font-size="10" font-weight="600" fill="#059669">Raw Notes / CSV / PDF</text>
    </g>

    <!-- Zone Info Pill -->
    <g transform="translate(20, 580)">
      <rect width="210" height="65" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="14" y="24" font-size="11" font-weight="700" fill="#334155">Ingress Guarantees</text>
      <text x="14" y="42" font-size="10" fill="#64748B">• Edge SSL Termination</text>
      <text x="14" y="56" font-size="10" fill="#64748B">• Server-to-Server Gateway</text>
    </g>
  </g>

  <!-- ZONE 2: AWS INFRASTRUCTURE ACCOUNT (Account B - 736969242498) -->
  <g transform="translate(320, 105)">
    <rect width="730" height="665" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="24" y="32" font-size="12" font-weight="700" fill="#4648D4" letter-spacing="0.5">ZONE 2: AWS ACCOUNT B — INFRASTRUCTURE &amp; COMPUTE (736969242498)</text>
    <rect x="24" y="44" width="682" height="1" fill="#E2E8F0"/>

    <!-- Sub-boundary: VPC -->
    <rect x="20" y="55" width="690" height="590" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="36" y="78" font-size="11" font-weight="700" fill="#64748B">VPC (ap-south-1) • Public Subnets with Direct IGW (No NAT Cost)</text>

    <!-- AWS Application Load Balancer -->
    <g transform="translate(36, 100)">
      <rect width="180" height="95" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="14" y="28" font-size="12" font-weight="700" fill="#0F172A">AWS ALB</text>
      <text x="14" y="44" font-size="10" fill="#64748B">Public Ingress (Port 80)</text>
      <rect x="14" y="60" width="152" height="22" rx="4" fill="#F1F5F9"/>
      <text x="20" y="75" font-size="9" font-family="monospace" fill="#475569">progressly-alb-prod</text>
    </g>

    <!-- ECS Express API -->
    <g transform="translate(256, 100)">
      <rect width="190" height="95" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="14" y="28" font-size="12" font-weight="700" fill="#0F172A">ECS: Express API</text>
      <text x="14" y="44" font-size="10" fill="#64748B">Node.js TypeScript API Service</text>
      <rect x="14" y="60" width="162" height="22" rx="4" fill="#EEF2FF"/>
      <text x="20" y="75" font-size="9" font-family="monospace" font-weight="600" fill="#4338CA">0.5 vCPU • 1GB RAM</text>
    </g>

    <!-- Amazon S3 Bucket -->
    <g transform="translate(486, 100)">
      <rect width="205" height="95" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="14" y="28" font-size="12" font-weight="700" fill="#0F172A">Amazon S3 Bucket</text>
      <text x="14" y="44" font-size="10" fill="#64748B">Raw Evidence Storage</text>
      <rect x="14" y="60" width="177" height="22" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="20" y="75" font-size="9" font-family="monospace" fill="#059669">AES-256 Encrypted</text>
