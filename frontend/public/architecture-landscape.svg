      <rect x="14" y="58" width="162" height="20" rx="4" fill="#EEF2FF"/>
      <text x="20" y="72" font-size="9" font-family="monospace" font-weight="700" fill="#4338CA">1.0 vCPU • 2GB RAM</text>
    </g>

    <!-- Amazon RDS PostgreSQL 16.9 + pgvector -->
    <g transform="translate(256, 490)">
      <rect width="435" height="130" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="20" y="30" font-size="13" font-weight="700" fill="#0F172A">Amazon RDS PostgreSQL 16.9 (pgvector extension)</text>
      <text x="20" y="48" font-size="11" fill="#64748B">Unified Single Store of Truth: WBS Master Nodes, Matches, Audit Trails, &amp; 40 Historical Records</text>

      <g transform="translate(20, 62)">
