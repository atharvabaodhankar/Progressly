      <text x="14" y="44" font-size="10" fill="#64748B">s3-to-sqs Event Router</text>
      <rect x="14" y="58" width="177" height="20" rx="4" fill="#FEF3C7"/>
      <text x="20" y="72" font-size="9" font-family="monospace" font-weight="600" fill="#B45309">s3:ObjectCreated</text>
    </g>

