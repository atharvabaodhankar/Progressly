  <!-- ZONE 3: AMAZON BEDROCK (Account A) -->
  <g transform="translate(1070, 105)">
    <rect width="322" height="665" rx="16" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.5"/>
    <text x="20" y="32" font-size="12" font-weight="700" fill="#7E22CE" letter-spacing="0.5">ZONE 3: AMAZON BEDROCK (ACCOUNT A)</text>
    <rect x="20" y="44" width="282" height="1" fill="#E9D5FF"/>

    <!-- Nova Micro -->
    <g transform="translate(20, 65)">
      <rect width="282" height="160" rx="12" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.5" filter="url(#card-shadow)"/>
      <rect x="16" y="16" width="32" height="32" rx="8" fill="#F3E8FF"/>
      <text x="56" y="30" font-size="14" font-weight="700" fill="#0F172A">Amazon Nova Micro</text>
      <text x="56" y="46" font-size="10" font-family="monospace" fill="#7E22CE">apac.amazon.nova-micro-v1:0</text>
      <text x="16" y="78" font-size="11" font-weight="600" fill="#334155">Task: Entity Extraction</text>
      <text x="16" y="96" font-size="10" fill="#64748B">Extracts discipline, line, location, &amp; quantity from free-text reports in sub-seconds.</text>
      <rect x="16" y="116" width="250" height="28" rx="6" fill="#FAF5FF" stroke="#E9D5FF"/>
      <text x="26" y="134" font-size="10" font-family="monospace" font-weight="700" fill="#059669">Cost: $0.035 / 1M input tokens</text>
    </g>

    <!-- Titan Embeddings V2 -->
    <g transform="translate(20, 250)">
      <rect width="282" height="160" rx="12" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.5" filter="url(#card-shadow)"/>
      <rect x="16" y="16" width="32" height="32" rx="8" fill="#EEF2FF"/>
      <text x="56" y="30" font-size="14" font-weight="700" fill="#0F172A">Titan Embeddings V2</text>
      <text x="56" y="46" font-size="10" font-family="monospace" fill="#4338CA">amazon.titan-embed-text-v2:0</text>
      <text x="16" y="78" font-size="11" font-weight="600" fill="#334155">Task: Dense Vector Generation</text>
      <text x="16" y="96" font-size="10" fill="#64748B">Generates 1024-dimensional normalized embeddings for cosine distance search.</text>
      <rect x="16" y="116" width="250" height="28" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="26" y="134" font-size="10" font-family="monospace" font-weight="700" fill="#4338CA">1024-dim • $0.020 / 1M tokens</text>
    </g>

    <!-- Nova Pro -->
    <g transform="translate(20, 435)">
      <rect width="282" height="175" rx="12" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.5" filter="url(#card-shadow)"/>
      <rect x="16" y="16" width="32" height="32" rx="8" fill="#FAF5FF"/>
      <text x="56" y="30" font-size="14" font-weight="700" fill="#0F172A">Amazon Nova Pro</text>
      <text x="56" y="46" font-size="10" font-family="monospace" fill="#7E22CE">apac.amazon.nova-pro-v1:0</text>
      <text x="16" y="78" font-size="11" font-weight="600" fill="#334155">Task: Institutional Memory RAG</text>
      <text x="16" y="96" font-size="10" fill="#64748B">Deep reasoning over retrieved historical delay records with verifiable citations.</text>
      <rect x="16" y="120" width="250" height="40" rx="6" fill="#FAF5FF" stroke="#E9D5FF"/>
      <text x="26" y="136" font-size="10" font-family="monospace" font-weight="700" fill="#7E22CE">300k Context Window</text>
      <text x="26" y="150" font-size="9" fill="#64748B">Strict grounding • Zero hallucination</text>
    </g>
