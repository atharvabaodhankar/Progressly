  <!-- CONNECTING ORTHOGONAL BUS LINES -->
  <!-- 1. Vercel to ALB -->
  <path d="M 278 365 L 356 365 L 356 250" stroke="#475569" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/>

  <!-- 2. ALB to Express API -->
  <path d="M 536 250 L 576 250" stroke="#475569" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/>

  <!-- 3. Express API to S3 -->
  <path d="M 766 250 L 806 250" stroke="#475569" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/>

  <!-- 4. S3 to Lambda -->
  <path d="M 908 300 L 908 340" stroke="#475569" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/>

  <!-- 5. Lambda to SQS -->
  <path d="M 908 430 L 908 465" stroke="#475569" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/>

  <!-- 6. SQS to AI Worker -->
  <path d="M 806 510 L 766 510" stroke="#475569" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/>

  <!-- 7. AI Worker to Bedrock Nova Micro -->
  <path d="M 766 490 L 1040 490 L 1040 245 L 1090 245" stroke="#7C3AED" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/>

  <!-- 8. AI Worker to Bedrock Titan V2 -->
