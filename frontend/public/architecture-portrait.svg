<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1180" width="100%" height="100%" fill="none" style="background:#FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Standard orthogonal arrowhead marker -->
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 6 4 L 1 6.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 6 4 L 1 6.5 z" fill="#6d28d9"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 6 4 L 1 6.5 z" fill="#1e40af"/>
    </marker>
  </defs>

  <!-- TOP CAPTION -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#0f172a" letter-spacing="-0.2">Progressly — System Architecture</text>
    <text x="0" y="18" font-size="11" font-weight="400" fill="#64748b">Production Multi-Account Topology &amp; Asynchronous Pipeline</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. CLIENT LAYER                                                           -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 75)">
    <!-- Browser -->
    <rect x="0" y="0" width="340" height="48" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#0f172a">Browser / Web Client</text>
    <text x="14" y="36" font-size="10" font-weight="400" fill="#475569">Field Supervisor &amp; Planning Engineer Dashboard</text>

    <!-- Arrow Browser -> Vercel -->
    <path d="M 340 24 L 380 24" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- Vercel Next.js -->
    <rect x="380" y="0" width="340" height="48" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="394" y="20" font-size="11" font-weight="700" fill="#0f172a">Vercel Edge (Next.js 14)</text>
    <text x="394" y="36" font-size="10" font-weight="400" fill="#475569">HTTPS / TLS 1.3 • /api-proxy/* Reverse Proxy</text>
  </g>

  <!-- CONNECTOR: Vercel Edge -> AWS Account B ALB -->
  <path d="M 550 123 L 550 155 L 400 155 L 400 175" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  <text x="408" y="150" font-size="9" font-family="monospace" font-weight="500" fill="#64748b">HTTPS Port 80/443</text>

  <!-- ========================================================================= -->
  <!-- 2. BOUNDARY BOX: AWS ACCOUNT B (INFRASTRUCTURE & COMPUTE)                 -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 175)">
    <!-- Boundary Box -->
    <rect x="0" y="0" width="720" height="580" rx="4" fill="#FFFFFF" stroke="#2563eb" stroke-width="1.2"/>
    <text x="16" y="22" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.2">AWS Account B — Infrastructure (ap-south-1)</text>

    <!-- ALB -->
    <rect x="180" y="35" width="360" height="44" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="194" y="53" font-size="11" font-weight="700" fill="#0f172a">AWS Application Load Balancer (ALB)</text>
    <text x="194" y="68" font-size="10" font-weight="400" fill="#475569">Public Internet-Facing • Direct IGW Ingress</text>

    <!-- Connector: ALB -> ECS Express API -->
    <path d="M 360 79 L 360 102" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- ECS Fargate: Express API -->
    <rect x="160" y="102" width="400" height="52" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="174" y="122" font-size="11" font-weight="700" fill="#0f172a">ECS Fargate — Express API</text>
    <text x="174" y="137" font-size="10" font-weight="400" fill="#475569">progressly-backend-service-prod (0.5 vCPU, 1GB RAM, Port 4000)</text>
    <text x="174" y="149" font-size="9" font-family="monospace" font-weight="500" fill="#64748b">WBS queries, match approvals, report intake</text>

    <!-- Supporting Service: AWS Secrets Manager -->
    <rect x="20" y="104" width="115" height="48" rx="3" fill="#FFFFFF" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="28" y="123" font-size="10" font-weight="700" fill="#334155">AWS Secrets</text>
    <text x="28" y="135" font-size="10" font-weight="700" fill="#334155">Manager</text>
    <text x="28" y="146" font-size="8.5" font-family="monospace" font-weight="400" fill="#64748b">db &amp; bedrock keys</text>

    <!-- Dotted line: Secrets Manager -> ECS Express API -->
    <path d="M 135 128 L 160 128" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

    <!-- Dotted line: Secrets Manager -> ECS AI Worker -->
    <path d="M 77 152 L 77 360 L 380 360" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

    <!-- Branch Point below ECS API -->
    <!-- Sync Path Label (Left) -->
    <text x="80" y="174" font-size="9.5" font-weight="700" fill="#1e293b">Sync Path (Queries &amp; Telemetry)</text>
    <!-- Async Path Label (Right) -->
    <text x="440" y="174" font-size="9.5" font-weight="700" fill="#1e293b">Async Path (Report Ingestion Pipeline)</text>

    <!-- Connector: ECS API -> RDS (Sync Path) -->
    <path d="M 230 154 L 230 450" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <text x="148" y="300" font-size="9" font-family="monospace" font-weight="500" fill="#475569" transform="rotate(-90 148 300)">Direct SQL / pgvector read/write</text>

    <!-- Connector: ECS API -> S3 Bucket (Async Path) -->
    <path d="M 490 154 L 490 190" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- ASYNC PIPELINE BOXES (Right side) -->
    <!-- S3 Bucket -->
    <rect x="380" y="190" width="310" height="42" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="394" y="208" font-size="11" font-weight="700" fill="#0f172a">Amazon S3 — Raw Evidence Bucket</text>
    <text x="394" y="222" font-size="10" font-weight="400" fill="#475569">progressly-raw-reports-prod (AES-256 Encrypted)</text>

    <!-- Connector: S3 -> Lambda Router -->
    <path d="M 535 232 L 535 254" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <text x="542" y="246" font-size="8.5" font-family="monospace" fill="#64748b">s3:ObjectCreated</text>

    <!-- Lambda Router -->
    <rect x="380" y="254" width="310" height="42" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="394" y="272" font-size="11" font-weight="700" fill="#0f172a">AWS Lambda — S3-to-SQS Router</text>
    <text x="394" y="286" font-size="10" font-weight="400" fill="#475569">progressly-s3-sqs-router-prod (Decoupled event trigger)</text>

    <!-- Connector: Lambda -> SQS Queue -->
    <path d="M 535 296 L 535 318" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- SQS Queue -->
    <rect x="380" y="318" width="310" height="42" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="394" y="336" font-size="11" font-weight="700" fill="#0f172a">Amazon SQS — Ingestion Queue</text>
    <text x="394" y="350" font-size="10" font-weight="400" fill="#475569">progressly-report-queue-prod (Decoupled buffer)</text>

    <!-- Connector: SQS -> ECS AI Worker -->
    <path d="M 535 360 L 535 382" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <text x="542" y="374" font-size="8.5" font-family="monospace" fill="#64748b">SQS Poll</text>

    <!-- ECS Fargate: AI Worker -->
    <rect x="380" y="382" width="310" height="52" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="394" y="402" font-size="11" font-weight="700" fill="#0f172a">ECS Fargate — AI Ingestion Worker</text>
    <text x="394" y="416" font-size="10" font-weight="400" fill="#475569">progressly-ai-worker-service-prod (1.0 vCPU, 2GB RAM)</text>
    <text x="394" y="427" font-size="9" font-family="monospace" font-weight="500" fill="#64748b">Coordinates Nova Micro, Titan V2, &amp; Nova Pro</text>

    <!-- Connector: ECS AI Worker -> RDS Database -->
    <path d="M 460 434 L 460 450" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <text x="466" y="445" font-size="8.5" font-family="monospace" fill="#475569">Persist matches &amp; embeddings</text>

    <!-- RDS Database (Common Sink across sync and async flows) -->
    <rect x="160" y="450" width="530" height="56" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
    <text x="174" y="472" font-size="12" font-weight="700" fill="#0f172a">Amazon RDS PostgreSQL 16.9 + pgvector</text>
    <text x="174" y="488" font-size="10" font-weight="400" fill="#475569">progressly-db-prod • Master WBS Activities, Daily Reports, Matches, Audit Logs</text>
    <text x="174" y="500" font-size="9" font-family="monospace" font-weight="500" fill="#64748b">1024d Cosine Similarity Index (HNSW) • Tenant Isolation</text>

    <!-- Note on VPC / Subnets inside Account B -->
    <text x="20" y="555" font-size="9.5" font-family="monospace" fill="#64748b">VPC: 10.0.0.0/16 • Public Subnets with Direct IGW Ingress (No NAT Gateways)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- CROSS-ACCOUNT CONNECTOR: ECS AI Worker -> AWS Account A Bedrock           -->
  <!-- ========================================================================= -->
  <path d="M 640 609 L 640 790" stroke="#6d28d9" stroke-width="1.2" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="525" y="760" width="225" height="18" rx="2" fill="#FFFFFF" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="531" y="772" font-size="8.5" font-family="monospace" font-weight="600" fill="#6d28d9">cross-account, Secrets Manager-mediated</text>

  <!-- ========================================================================= -->
  <!-- 3. BOUNDARY BOX: AWS ACCOUNT A (BEDROCK FOUNDATION MODELS)                -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 790)">
    <!-- Boundary Box -->
    <rect x="0" y="0" width="720" height="230" rx="4" fill="#FFFFFF" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="16" y="22" font-size="11" font-weight="700" fill="#6d28d9" letter-spacing="0.2">AWS Account A — Bedrock (scoped IAM)</text>

    <g transform="translate(20, 36)">
      <!-- Nova Micro -->
      <rect x="0" y="0" width="216" height="120" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#0f172a">Amazon Nova Micro</text>
      <text x="12" y="34" font-size="9.5" font-family="monospace" font-weight="500" fill="#6d28d9">apac.amazon.nova-micro-v1:0</text>
      <line x1="12" y1="42" x2="204" y2="42" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="58" font-size="10" font-weight="700" fill="#334155">Role: Entity Extraction</text>
      <text x="12" y="73" font-size="9.5" font-weight="400" fill="#475569">Extracts discipline, line number,</text>
      <text x="12" y="86" font-size="9.5" font-weight="400" fill="#475569">location, and installed quantity</text>
      <text x="12" y="104" font-size="9" font-family="monospace" fill="#64748b">Rate: $0.035 / $0.14 per 1M</text>

      <!-- Titan Embeddings V2 -->
      <rect x="232" y="0" width="216" height="120" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
      <text x="244" y="20" font-size="11" font-weight="700" fill="#0f172a">Amazon Titan Embeddings V2</text>
      <text x="244" y="34" font-size="9.5" font-family="monospace" font-weight="500" fill="#6d28d9">amazon.titan-embed-text-v2:0</text>
      <line x1="244" y1="42" x2="436" y2="42" stroke="#e2e8f0" stroke-width="1"/>
      <text x="244" y="58" font-size="10" font-weight="700" fill="#334155">Role: Semantic Embeddings</text>
      <text x="244" y="73" font-size="9.5" font-weight="400" fill="#475569">Generates 1024-dim dense vectors</text>
      <text x="244" y="86" font-size="9.5" font-weight="400" fill="#475569">for schedule WBS cosine ranking</text>
      <text x="244" y="104" font-size="9" font-family="monospace" fill="#64748b">Rate: $0.020 per 1M tokens</text>

      <!-- Nova Pro -->
      <rect x="464" y="0" width="216" height="120" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
      <text x="476" y="20" font-size="11" font-weight="700" fill="#0f172a">Amazon Nova Pro</text>
      <text x="476" y="34" font-size="9.5" font-family="monospace" font-weight="500" fill="#6d28d9">apac.amazon.nova-pro-v1:0</text>
      <line x1="476" y1="42" x2="668" y2="42" stroke="#e2e8f0" stroke-width="1"/>
      <text x="476" y="58" font-size="10" font-weight="700" fill="#334155">Role: Institutional Memory RAG</text>
      <text x="476" y="73" font-size="9.5" font-weight="400" fill="#475569">Multi-project delay root cause</text>
      <text x="476" y="86" font-size="9.5" font-weight="400" fill="#475569">synthesis with strict citations</text>
      <text x="476" y="104" font-size="9" font-family="monospace" fill="#64748b">Rate: $0.80 / $3.20 per 1M</text>
    </g>

    <!-- Bedrock Scoped IAM Security Note -->
    <text x="20" y="180" font-size="9.5" font-family="monospace" fill="#64748b">Scoped IAM Execution Role: bedrock:InvokeModel restricted to designated inference profiles</text>
    <text x="20" y="196" font-size="9.5" font-family="monospace" fill="#64748b">Region: ap-south-1 (Mumbai) • Zero persistent payload caching on model endpoints</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. SIDE NOTE / LEGEND (BOTTOM)                                            -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 1045)">
    <line x1="0" y1="0" x2="720" y2="0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="20" font-size="10" font-weight="700" fill="#1e293b">Operational Calibration &amp; Confidence Tiers:</text>
    <text x="0" y="36" font-size="9.5" font-weight="400" fill="#475569">1. ≥95% Confidence (Tier 1): Auto-approved &amp; linked directly to baseline schedule WBS activity.</text>
    <text x="0" y="50" font-size="9.5" font-weight="400" fill="#475569">2. 70–94% Confidence (Tier 2): Routed to Lead Planning Engineer review queue for one-click verification.</text>
    <text x="0" y="64" font-size="9.5" font-weight="400" fill="#475569">3. &lt;70% Confidence (Tier 3): Flagged for manual WBS resolution; zero automated schedule alterations.</text>
    <text x="0" y="82" font-size="9" font-family="monospace" fill="#64748b">Provenance: 100% strict citations mapped to Master WBS in RDS PostgreSQL • Security: Multi-Account IAM Boundaries</text>
  </g>
</svg>
