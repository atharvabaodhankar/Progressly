      <text x="16" y="48" font-size="10" font-family="monospace" fill="#7E22CE">apac.amazon.nova-pro-v1:0</text>
      <text x="16" y="78" font-size="11" font-weight="600" fill="#334155">Task: Memory RAG Synthesis</text>
