      <text x="16" y="48" font-size="10" font-family="monospace" fill="#4338CA">amazon.titan-embed-text-v2:0</text>
      <text x="16" y="78" font-size="11" font-weight="600" fill="#334155">Task: Dense Vectors</text>
      <text x="16" y="98" font-size="10" fill="#64748B">Generates 1024-dimensional normalized vector embeddings for cosine similarity search.</text>
      <rect x="16" y="240" width="188" height="45" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="24" y="258" font-size="10" font-family="monospace" font-weight="700" fill="#4338CA">1024-dim Vector</text>
