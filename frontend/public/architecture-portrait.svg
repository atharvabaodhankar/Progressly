      <text x="16" y="48" font-size="10" font-family="monospace" fill="#7E22CE">apac.amazon.nova-micro-v1:0</text>
      <text x="16" y="78" font-size="11" font-weight="600" fill="#334155">Task: Entity Extraction</text>
      <text x="16" y="98" font-size="10" fill="#64748B">Extracts discipline, line number, location, and quantities from messy site notes.</text>
