      <rect width="220" height="105" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow-v)"/>
      <text x="16" y="28" font-size="13" font-weight="700" fill="#0F172A">Site Field Input</text>
      <text x="16" y="46" font-size="11" font-weight="500" fill="#64748B">Supervisor Daily Diary</text>
      <rect x="16" y="65" width="188" height="24" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="24" y="81" font-size="10" font-family="monospace" font-weight="600" fill="#059669">Raw Notes / CSV / PDF</text>
    </g>
