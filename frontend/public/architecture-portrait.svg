      <text x="16" y="28" font-size="13" font-weight="700" fill="#0F172A">Web Dashboard</text>
      <text x="16" y="46" font-size="11" font-weight="500" fill="#64748B">Next.js 14 App Router</text>
      <rect x="16" y="65" width="188" height="24" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="24" y="81" font-size="10" font-family="monospace" font-weight="600" fill="#4648D4">HTTPS / TLS 1.3 Edge</text>
    </g>

    <g transform="translate(270, 60)">
