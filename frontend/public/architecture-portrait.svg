    <rect x="24" y="42" width="712" height="1" fill="#E2E8F0"/>

    <!-- VPC Sub-box -->
    <rect x="20" y="55" width="720" height="585" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="36" y="78" font-size="11" font-weight="700" fill="#64748B">VPC (ap-south-1) • Public Subnets with Direct IGW (No NAT Gateways)</text>

