<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1480" width="100%" height="100%" fill="none" style="background:#FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-v" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-v-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7E22CE"/>
    </marker>
    <filter id="card-shadow-v" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- TITLE HEADER -->
  <g transform="translate(40, 48)">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#0F172A" letter-spacing="-0.5">Progressly : Production System Architecture</text>
    <text x="0" y="24" font-size="13" font-weight="500" fill="#64748B">Event-Driven Asynchronous Pipeline &amp; Multi-Account Bedrock RAG (ap-south-1)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- ZONE 1: CLIENT & VERCEL EDGE INGRESS                                      -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 95)">
    <rect width="760" height="190" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="24" y="30" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">ZONE 1: CLIENT &amp; VERCEL EDGE INGRESS</text>
    <rect x="24" y="42" width="712" height="1" fill="#E2E8F0"/>

    <g transform="translate(24, 60)">
