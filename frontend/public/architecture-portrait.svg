    <text x="24" y="30" font-size="12" font-weight="700" fill="#7E22CE" letter-spacing="0.5">ZONE 3: AMAZON BEDROCK FOUNDATION MODELS (ACCOUNT A)</text>
    <rect x="24" y="42" width="712" height="1" fill="#E9D5FF"/>

